<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=block" rel="stylesheet">
<style>
@font-face{font-family:Inter;src:url(../../../server/assets/fonts/Inter-Regular.otf);font-weight:400}
@font-face{font-family:Inter;src:url(../../../server/assets/fonts/Inter-Bold.otf);font-weight:700 800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#15172A;background:#FAF9F7;position:relative;padding:72px 80px;display:flex;flex-direction:column}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 55% 60% at 100% 0%,rgba(139,92,246,.2),transparent 70%),radial-gradient(ellipse 45% 50% at 0% 100%,rgba(45,212,191,.16),transparent 70%)}
.brand{position:relative;display:flex;align-items:center;gap:20px;font-family:"Space Grotesk";font-weight:700;font-size:44px;letter-spacing:-.03em}
.brand img{width:76px;height:76px;filter:drop-shadow(0 10px 24px rgba(91,43,224,.3))}
h1{position:relative;font-family:"Space Grotesk";font-weight:700;font-size:96px;line-height:1;letter-spacing:-.04em;margin-top:auto}
h1 em{font-style:normal;background:linear-gradient(120deg,#5B2BE0,#12A68C);-webkit-background-clip:text;color:transparent;padding-right:.05em}
p{position:relative;font-size:29px;color:#5B5E72;margin-top:auto}
</style></head><body>
<div class="brand"><img src="../logo-icon.svg">EvidenTalent</div>
<h1>Make your talent<br><em>evident.</em></h1>
<p>Every skill rated 1–5, backed by proof · Free for job seekers and employers</p>
</body></html>
