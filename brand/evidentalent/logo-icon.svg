<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EvidenTalent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A3BF0"/><stop offset="1" stop-color="#3A1C9C"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- EVT monogram: three bars for the E, a V that runs into the T's top bar
       (together, a checkmark), and the T's stem set apart by a gap. -->
  <g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- The E's top bar curves down into a rounded V. -->
    <path d="M80 256H184M80 336H184"/>
    <!-- The V's right side stops three-quarters of the way up, short of the T's bar. -->
    <path d="M80 176H162Q196 176 208.7 207.5L257 327.7Q266 350 275 327.7L319.5 217"/>
    <path d="M352 176H440"/>
    <path d="M396 230V336"/>
  </g>
</svg>
